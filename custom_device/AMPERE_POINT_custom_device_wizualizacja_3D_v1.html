dut.add(bx(36,36,54,-225,95,152,0x22262a));
const wb=new T.Group();const wbb=bx(160,240,80,0,130,0,0xfafafa);wb.add(wbb);wb.add(bx(120,60,4,0,170,42,0x11161c));

function mkLabel(txt,ax,ay,az,ox,oy,oz){const c2=document.createElement('canvas');let g=c2.getContext('2d');g.font='500 44px system-ui,sans-serif';
const w=Math.ceil(g.measureText(txt).width)+52;c2.width=w;c2.height=74;g=c2.getContext('2d');g.font='500 44px system-ui,sans-serif';
g.fillStyle='rgba(24,32,44,.92)';if(g.roundRect){g.beginPath();g.roundRect(0,0,w,74,18);g.fill()}else g.fillRect(0,0,w,74);
g.fillStyle='#fff';g.textAlign='center';g.textBaseline='middle';g.fillText(txt,w/2,40);
const tx=new T.CanvasTexture(c2);tx.minFilter=T.LinearFilter;
const sp=new T.Sprite(new T.SpriteMaterial({map:tx,depthTest:false,transparent:true}));
sp.scale.set(w*.8,59,1);sp.position.set(ax+ox,ay+oy,az+oz);sp.renderOrder=99;
const ln=new T.Line(new T.BufferGeometry().setFromPoints([new T.Vector3(ax,ay,az),sp.position.clone()]),new T.LineBasicMaterial({color:0x5b6672,depthTest:false,transparent:true,opacity:.85}));
ln.renderOrder=98;labelsG.add(sp);labelsG.add(ln)}

const groups={'Moduł A — panel i obudowa':['x1','x2','banan','esh','warn','estop','start','q0h','led','hmi','schuko'],'Moduł A — wnętrze':['q0','fuses','k1','b1','ct','bus','oslona','u2','a3','k30','g1','rel','a1','pm'],'Moduł B — obciążenie':['fan','heat','ksd','skrz','zal'],'Połączenia':['cee','ster','dut']};
const sel=document.getElementById('selPart');
Object.keys(groups).forEach(gn=>{const og=document.createElement('optgroup');og.label=gn;groups[gn].forEach(id=>{const o=document.createElement('option');o.value=id;o.textContent=parts[id].name;og.appendChild(o)});sel.appendChild(og)});
const tgt=new T.Vector3(340,220,60);let sph={r:2650,th:.85,ph:1.06},focusTo=null,interacted=false;
function applyCam(){cam.position.set(tgt.x+sph.r*Math.sin(sph.ph)*Math.sin(sph.th),tgt.y+sph.r*Math.cos(sph.ph),tgt.z+sph.r*Math.sin(sph.ph)*Math.cos(sph.th));cam.lookAt(tgt)}
let selId=null;
const nameEl=document.getElementById('infoName'),descEl=document.getElementById('infoDesc');
function select(id){if(selId&&parts[selId])parts[selId].meshes.forEach(m=>{if(m.material.emissive){m.material.emissive.setHex(0);m.material.emissiveIntensity=1}});
selId=id;if(!id||!parts[id]){nameEl.textContent='';descEl.textContent='';return}
parts[id].meshes.forEach(m=>{if(m.material.emissive){m.material.emissive.setHex(0x2563eb);m.material.emissiveIntensity=.5}});
nameEl.textContent=parts[id].name;descEl.textContent=parts[id].info;sel.value=id;focusTo=parts[id].focus.clone()}
sel.addEventListener('change',()=>select(sel.value));
let lidOpen=false,xray=false,coverOn=true,lblOn=true;
const bLid=document.getElementById('btnLid'),bX=document.getElementById('btnXray'),bC=document.getElementById('btnCover'),bL=document.getElementById('btnLbl');
bLid.onclick=()=>{lidOpen=!lidOpen;bLid.classList.toggle('on',lidOpen);bLid.textContent=lidOpen?'Zamknij pokrywę':'Otwórz pokrywę'};
bX.onclick=()=>{xray=!xray;bX.classList.toggle('on',xray);wallsX.forEach(m=>{m.material.transparent=true;m.material.opacity=xray?.13:1;m.material.depthWrite=!xray;m.material.needsUpdate=true})};
bC.onclick=()=>{coverOn=!coverOn;bC.classList.toggle('on',coverOn);cover.visible=coverOn};
bL.onclick=()=>{lblOn=!lblOn;bL.classList.toggle('on',lblOn);labelsG.visible=lblOn};
document.getElementById('btnReset').onclick=()=>{sph={r:2650,th:.85,ph:1.06};tgt.set(340,220,60);focusTo=null;select('')};
let drag=null;
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,b:e.button,moved:0};interacted=true;cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.moved+=Math.abs(dx)+Math.abs(dy);
if(drag.b===2||e.ctrlKey){const f=sph.r*.0011,right=new T.Vector3(),up=new T.Vector3(0,1,0);cam.getWorldDirection(right);right.cross(up).normalize();tgt.addScaledVector(right,-dx*f);tgt.y+=dy*f;focusTo=null}
else{sph.th-=dx*.005;sph.ph=Math.min(1.5,Math.max(.15,sph.ph-dy*.005))}
drag.x=e.clientX;drag.y=e.clientY});
cv.addEventListener('pointerup',e=>{if(drag&&drag.moved<6){const r=cv.getBoundingClientRect(),v=new T.Vector2(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1),rc=new T.Raycaster();rc.setFromCamera(v,cam);const hit=rc.intersectObjects(clickable,false)[0];select(hit?hit.object.userData.pid:'')}drag=null});
cv.addEventListener('wheel',e=>{e.preventDefault();interacted=true;sph.r=Math.min(6500,Math.max(450,sph.r*(1+e.deltaY*.001)))},{passive:false});
function resize(){const w=cv.clientWidth,h=cv.clientHeight;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
window.addEventListener('resize',resize);
function loop(){requestAnimationFrame(loop);
const la=lidOpen?-1.78:0;lid.rotation.x+=(la-lid.rotation.x)*.08;
if(!interacted)sph.th+=.0016;
if(focusTo){tgt.lerp(focusTo,.06);if(tgt.distanceTo(focusTo)<2)focusTo=null}
applyCam();renderer.render(scene,cam)}
resize();applyCam();loop();
</script>
