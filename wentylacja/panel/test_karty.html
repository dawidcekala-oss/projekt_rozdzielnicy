const log = [];

window.addEventListener('error', e => p('BLAD GLOBALNY: ' + e.message));
try {

} catch (e) { p('1. import modulu: BLAD -> ' + e.message); }
p('2. element zarejestrowany: ' + !!customElements.get('biuro-panel'));

  const el = document.createElement('biuro-panel');
  el.setConfig(cfg);
  p('3. setConfig: OK');
  el.hass = { states: {}, callService(){} };
  p('4. set hass przy pustych encjach: OK');
  document.getElementById('miejsce').appendChild(el);
  p('5. wstawienie do strony: OK, znacznikow: ' + el.shadowRoot.querySelectorAll('.jedn').length);
